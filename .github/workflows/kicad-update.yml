# Weekly: open a PR when linuxserver publishes a newer stable kicad tag (X.Y.Z-rN-lsNNN). Humans review and merge.
name: kicad-update
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open PR for newer base tag
        run: |
          python3 scripts/latest_base_tag.py --selftest
          read -r new old < <(python3 scripts/latest_base_tag.py)
          echo "newest=$new pinned=$old"
          [ "$new" != "$old" ] || { echo "up to date"; exit 0; }
          # the script only returns the max, so guard against a pin that is already newer
          [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$new" ] || { echo "pin is newer"; exit 0; }
          branch="update/kicad-$new"
          if [ -n "$(gh pr list --state open --head "$branch" --json number -q '.[].number')" ]; then
            echo "PR already open"; exit 0
          fi
          git switch -c "$branch"
          sed -i "s|^\(ARG KICAD_IMAGE=.*:\)$old\$|\1$new|" Dockerfile
          sed -i "s|$old|$new|g" README.md
          git diff --quiet Dockerfile && { echo "Dockerfile pin not updated"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "KiCad base $old -> $new"
          git push origin "$branch"
          cat > body.md <<BODY
          Automatic update of the \`linuxserver/kicad\` base tag: \`$old\` -> \`$new\`.

          What changed: a newer stable tag was published. A higher \`rN\` or version means a new KiCad packaging; a higher \`lsNNN\` alone is a base-image rebuild (including security updates). See https://github.com/linuxserver/docker-kicad/releases for the release notes.

          After merging:
          - Merging to main builds and pushes \`ghcr.io/kicadaiplayground/kicad-desktop:$new-krt<KRT_VERSION>\`.
          - The cluster is not updated by this: in a second PR in k3s-cluster, bump the digest pin in \`apps/kicad/*.yaml\` and \`KICAD = (x, y, z)\` in \`apps/kicad/pcm-sync.py\`.
          - Rolling that out restarts the KiCad desktop (open sessions are lost).

          No auto-merge: please review.
          BODY
          gh pr create --base main --head "$branch" --title "KiCad base $old -> $new" --body-file body.md
